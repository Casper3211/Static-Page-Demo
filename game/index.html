<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Would You Rather? · UConn AI Club</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f8faf8;color:#142d32;font:18px/1.6 system-ui,sans-serif}main{max-width:850px;margin:auto;padding:36px 24px}header{font-weight:750;color:#087e80}h1{font-size:clamp(40px,7vw,70px);line-height:1.1;margin:65px 0 20px}p{color:#536b70}label{display:block;margin-top:30px}select,button{font:inherit;padding:14px;border:1px solid #b7d1cb;border-radius:12px;background:white;color:#142d32}select{width:100%;max-width:350px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:28px 0}.choices button{min-height:145px;cursor:pointer;text-align:left}.choices button:hover{border-color:#087e80}.choices button[aria-pressed=true]{background:#d8f1e8;border:2px solid #087e80}button:focus-visible,a:focus-visible,select:focus-visible{outline:3px solid #c17b24;outline-offset:3px}#next{background:#087e80;color:white;cursor:pointer}nav{margin-top:50px}a{color:#087e80}#status{min-height:32px}@media(max-width:540px){.choices{grid-template-columns:1fr}h1{margin-top:40px}}</style></head>
<body><main><header>UConn AI Club</header><h1>Would you rather…?</h1><p>Pick a theme, choose A or B, and defend your answer.<br>Built-in questions · no AI request or account needed.</p>
<label for="theme">Choose a theme</label><select id="theme"><option value="powers">Superpowers</option><option value="campus">Campus life</option><option value="food">Food</option></select>
<div class="choices"><button id="a" aria-pressed="false"></button><button id="b" aria-pressed="false"></button></div><p id="status" role="status">Which would you choose?</p><button id="next">Next question →</button>
<nav><a href="../">← Original website</a> · <a href="../ai-would-you-rather/">Open the chat demo</a></nav>
</main><script>
// Add your own pairs here. Keep each pair as ["choice A", "choice B"].
const questions={powers:[["Teleport anywhere, but always arrive in pajamas?","Fly anywhere, but only at walking speed?"],["Talk to cats, but they only complain?","Understand birds, but they never stop singing?"]],campus:[["Have every class start at sunrise?","Have every assignment due at midnight?"],["Have a robot take notes in rhyme?","Have a backpack that sings your schedule?"]],food:[["Eat pizza with a spoon forever?","Eat soup with chopsticks forever?"],["Have every dessert taste like broccoli?","Have every vegetable taste like cake?"]]};
let index=0;const $=id=>document.getElementById(id);
function show(){const pair=questions[$('theme').value][index];['a','b'].forEach((id,i)=>{ $(id).textContent=(i?'B. ':'A. ')+pair[i];$(id).setAttribute('aria-pressed','false');});$('status').textContent='Which would you choose?';}
$('theme').onchange=()=>{index=0;show();};$('next').onclick=()=>{index=(index+1)%questions[$('theme').value].length;show();};
['a','b'].forEach(id=>$(id).onclick=()=>{['a','b'].forEach(x=>$(x).setAttribute('aria-pressed',String(x===id)));$('status').textContent='You chose '+id.toUpperCase()+'. Tell someone why!';});show();
</script></body></html>
